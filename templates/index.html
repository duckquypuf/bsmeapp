<!DOCTYPE html>
<html lang="en">
<head>
  <title>My Mobile Site (BSME)</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>BSME App 2027</h1>
  </header>

  <main>
    <div class="navbar">
      <nav class="nav-links">
        <a href="#overall-section">Overall Performance</a>
        <a href="#football-section">Football</a>
        <a href="#swimming-section">Swimming</a>
      </nav>
    </div>

    <h2>Track your child's progress here:</h2>
    <form>
      <h4>Input Player Name:</h4>
      <input title="Name"><br><br>
      <button type="submit">Submit</button>
    </form>

    <div id="overall-section">
      <h3>Current Table</h3>
      <table>
        <thead>
          <tr>
            <th>Position</th>
            <th>School</th>
            <th>Points</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>St. Christopher's School Bahrain</td>
            <td>38</td>
          </tr>
          <tr>
            <td>2</td>
            <td>other school</td>
            <td>23</td>
          </tr>
          <tr>
            <td>3</td>
            <td>other cavaliers</td>
            <td>19</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div id="football-section">
      <h3>Football</h3>
    </div>
  </main>
</body>
</html>
